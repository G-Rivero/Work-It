<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work It! - Perfil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style-cliente.css">
</head>
<body>
    <div class="app">
        <header class="topo">

            <h1>
                Work It!
            </h1>

        </header> 
        <main class="map-container">


            <!-- =================================================
                 MAIN
                 ================================================= -->

            <main class="perfil-container">
                <div class="pfp">
                    <img src="../assets/img/tux_goku.png" alt="Foto de Perfil">
                </div>
                <div class="sidebar">
                    <h1>Super Ubuntu</h1>
                    <h4>Técnico de T.I.</h4>

                    <button class="botao-seguir" type="button">
                        Pedir Serviço
                    </button>
                </div>

                <div class="principal">
                     
                </div>

            </main>

            <!-- =================================================
                 MENU LATERAL
                 ================================================= -->

            <nav class="menu-lateral">

                <a href="mapa-cliente.html">
                <button
                    class="menu-botao"
                    type="button"
                    aria-label="Página inicial"
                >

                    <i class="fa-solid fa-house"></i>
                
                </button>
                </a>

                <button
                    class="menu-botao"
                    type="button"
                    aria-label="Pesquisar"
                >

                    <i class="fa-solid fa-magnifying-glass"></i>

                </button>


                <button
                    class="menu-botao ativo"
                    type="button"
                    aria-label="Perfil"
                >

                    <i class="fa-regular fa-circle-user"></i>

                </button>


            </nav>


        </main>
    </div>

        <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script
        src="../JavaScript/mapa-cliente.js"
    ></script>
</body>
</html>
