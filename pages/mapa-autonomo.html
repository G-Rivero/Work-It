<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Work It! - Home</title>


    <!-- Leaflet -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <!-- Bootstrap -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- CSS próprio -->

    <link
        rel="stylesheet"
        href="../assets/css/style-autonomo.css"
    >

</head>


<body>


    <div class="app">


        <!-- =====================================================
             CABEÇALHO
             ===================================================== -->

        <header class="topo">

            <h1>
                Work It!
            </h1>

        </header>


        <!-- =====================================================
             ÁREA PRINCIPAL
             ===================================================== -->

        <main class="map-container">


            <!-- =================================================
                 CONTROLES DO MAPA
                 ================================================= -->

            <section class="controles-mapa">


                <!-- =============================================
                     PESQUISA
                     ============================================= -->

                <div class="barra-pesquisa">

                    <i class="fa-solid fa-magnifying-glass icone-pesquisa"></i>

                    <input
                        type="text"
                        id="pesquisaInput"
                        placeholder="Achar local, serviço ou região"
                        autocomplete="off"
                    >

                    <button
                        id="btnPesquisaLocal"
                        type="button"
                        aria-label="Pesquisar"
                    >

                        <span class="texto-buscar">
                            Buscar
                        </span>

                        <i class="fa-solid fa-arrow-right icone-buscar"></i>

                    </button>

                </div>


                <!-- =============================================
                     ESTADO E CIDADE
                     ============================================= -->

                <div class="seletores-regiao">


                    <!-- Estado -->

                    <div class="campo-regiao">

                        <i class="fa-solid fa-map"></i>

                        <select
                            id="selectEstado"
                            aria-label="Selecione o estado"
                        >

                            <option value="SP">
                                São Paulo
                            </option>

                        </select>

                    </div>


                    <!-- Cidade -->

                    <div class="campo-regiao">

                        <i class="fa-solid fa-location-dot"></i>

                        <select
                            id="selectCidade"
                            aria-label="Selecione a cidade"
                        >

                            <option value="">
                                Selecione a cidade
                            </option>

                            <option value="franco-da-rocha">
                                Franco da Rocha
                            </option>

                            <option value="mairipora">
                                Mairiporã
                            </option>

                            <option value="cajamar">
                                Cajamar
                            </option>

                            <option value="jundiai">
                                Jundiaí
                            </option>

                        </select>

                    </div>


                </div>


            </section>


            <!-- =================================================
                 MAPA
                 ================================================= -->

            <div id="map"></div>


            <!-- =================================================
                 MENU LATERAL
                 ================================================= -->

            <nav class="menu-lateral">


                <button
                    class="menu-botao ativo"
                    type="button"
                    aria-label="Página inicial"
                >

                    <i class="fa-solid fa-house"></i>

                </button>


                <button
                    class="menu-botao"
                    type="button"
                    aria-label="Pesquisar serviços"
                >

                    <i class="fa-solid fa-magnifying-glass"></i>

                </button>


                <button
                    class="menu-botao"
                    type="button"
                    aria-label="Perfil"
                >

                    <i class="fa-regular fa-circle-user"></i>

                </button>


            </nav>


        </main>


    </div>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->


    <!-- Leaflet -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <!-- Bootstrap -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- JavaScript próprio -->

    <script
        src="../JavaScript/mapa.js"
    ></script>


</body>

</html>
