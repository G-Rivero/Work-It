<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work It! - Cadastro</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    
    <div class="boasVindas">
        <h1>Bem Vindo ao Work It!</h1>
        <h5>Crie sua conta como autônomo</h5>
        <div class="linkLogin">
            <p>Já tem uma conta? <a href="login-autonomo.html">Faça login aqui</a></p>
        </div>
    </div>
    
    <div class="cadastro">
        <form class="formularioCadastro" action="cadastro-local-autonomo.html" method="post" style="margin-top: -85px;">
            <input
                type="text"
                class="inputNome"
                name="nome"
                placeholder="Nome Completo"
                required
            />
            
            <div class="linha">
                <label for="data">Data de Nascimento</label>
                <input
                    type="date"
                    class="inputNasc"
                    name="data"
                    required
                />

                <input
                    type="email"
                    class="inputEmail"
                    name="email"
                    placeholder="Email"
                    required
                />
            </div>
            <input
                type="text"
                class="inputCPNJ"
                name="cpfOuCnpj"
                placeholder="CPF/CNPJ"
                required
            />
            <input
                type="password"
                class="inputSenha"
                name="senha"
                placeholder="Crie uma Senha"
                required
            />
            <input
                type="password"
                class="inputSenha"
                name="confirmeSenha"
                placeholder="Confirme sua Senha"
                required
            />
            <button type="submit" class="btnCadastrar">
                Próxima Etapa
            </button>
        </form>
    </div>

</body>
</html>
