<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work It! - Login</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
        <div class="boasVindas">
        <h1>Bem Vindo ao Work It!</h1>
        <h5>Encontre novos clientes, entre na sua conta de autônomo no Work It!</h5>
        <div class="linkLogin">
            <p>Não tem uma conta? <a href="cadastro-autonomo.html">Crie uma aqui</a></p>
        </div>
    </div>
    
    <div class="login">
        <form class="formularioLogin" action="mapa-autonomo.html" method="get">
            <input
                type="text"
                class="inputCnpj"
                name="cpfOuCnpj"
                placeholder="CPF/CNPJ"
                required
            />
            <input
                type="email"
                class="inputEmail"
                name="email"
                placeholder="Email"
                required
            />
            <input
                type="password"
                class="inputSenha"
                name="senha"
                placeholder="Senha"
                required
            />
            <button type="submit" class="btnLogar">
                Entrar
            </button>
        </form>
    </div>


    
</body>
</html>
