<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
        <div class="boasVindas">
        <h1>Bem Vindo ao Work It!</h1>
        <h5>Entre na sua conta</h5>
        <div class="linkLogin">
            <p>Não tem uma conta? <a href="../index.html">Crie uma aqui</a></p>
        </div>
    </div>
    
    <div class="login">
        <form class="formularioLogin" action="https://formspree.io/f/xzedegww" method="get">
            <input type="hidden" name="_next" value="mapa-cliente.html">
            <input
                type="email"
                class="inputEmail"
                name="email"
                placeholder="Email"
                required
            />
            <input
                type="password"
                class="inputSenha"
                name="senha"
                placeholder="Senha"
                required
            />
            <button type="submit" class="btnLogar">
                Entrar
            </button>
        </form>
    </div>


    
</body>
</html>
